<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ROAR TV</title>

<style>
body{
background:#111827;
font-family:Arial;
color:white;
padding:20px;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#1f2937;
padding:15px;
border-radius:15px;
text-align:center;
}

img{
width:120px;
height:120px;
object-fit:contain;
background:white;
padding:10px;
border-radius:10px;
}

button{
margin-top:10px;
padding:10px;
border:none;
border-radius:10px;
background:#22c55e;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<h1>ROAR CHANNELS</h1>

<div class="container" id="channels"></div>

<script>

const repo = "shamimpipon/ROAR";

async function loadImages(){

const api =
`https://api.github.com/repos/${repo}/contents`;

const response = await fetch(api);
const data = await response.json();

const container =
document.getElementById("channels");

data.forEach(file=>{

if(file.name.endsWith(".png")
|| file.name.endsWith(".jpg")
|| file.name.endsWith(".jpeg")
|| file.name.endsWith(".webp")){

const card = document.createElement("div");
card.className = "card";

card.innerHTML = `
<img src="${file.download_url}">

<h3>${file.name}</h3>

<button onclick="copyUrl('${file.download_url}')">
Copy URL
</button>
`;

container.appendChild(card);

}

});

}

function copyUrl(url){
navigator.clipboard.writeText(url);
alert("URL Copied");
}

loadImages();

</script>

</body>
</html>
