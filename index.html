<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ROAR TV</title>

<style>
body {
    background: #000;
    font-family: Arial;
    padding: 15px;
    margin: 0;
}

h1 {
    text-align: center;
    color: #d9ff00;
    margin-bottom: 20px;
    font-size: 30px;
}

#searchBox {
    width: 100%;
    max-width: 800px;
    margin: 0 auto 20px auto;
    display: block;
    padding: 12px 15px;
    font-size: 16px;
    border: none;
    border-radius: 20px;
    outline: none;
    box-sizing: border-box;
    background: #fff;
}

/* ৬টি কলামের গ্রিড লেআউট */
.container {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    max-width: 1200px;
    margin: 0 auto;
}

.card {
    background: #071a4a;
    border-radius: 15px;
    overflow: hidden;
    border: 2px solid #1e293b;
    padding: 8px;
    text-align: center;
}

.image-box {
    background: white;
    padding: 8px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
}

img {
    width: 100%;
    height: 80px;
    object-fit: contain;
}

.logo-name {
    color: #fff;
    margin-top: 8px;
    font-size: 11px;
    font-weight: bold;
    word-break: break-all;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.bottom {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
}

button {
    padding: 5px 8px;
    border: none;
    border-radius: 15px;
    background: #22c55e;
    color: white;
    font-size: 10px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: #16a34a;
}

.size {
    font-size: 10px;
    color: white;
    background: #111827;
    padding: 3px 6px;
    border-radius: 15px;
}

/* রেসপনসিভ ডিজাইন */
@media(max-width: 900px) { .container { grid-template-columns: repeat(4, 1fr); } }
@media(max-width: 600px) { .container { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>

<body>

<h1>Shamim Live Tv Logo</h1>

<input id="searchBox" type="text" placeholder="🔍 Search Logo..." onkeyup="searchImages()">

<div class="container" id="channels"></div>

<script>
const repo = "shamimpipon/ROAR";

async function loadImages() {
    const api = `https://api.github.com/repos/${repo}/contents`;
    const response = await fetch(api);
    const data = await response.json();
    const container = document.getElementById("channels");
    container.innerHTML = "";

    data.forEach(file => {
        if (file.name.match(/\.(png|jpg|jpeg|webp)$/i)) {
            const card = document.createElement("div");
            card.className = "card";
            card.setAttribute("data-name", file.name.toLowerCase());
            
            card.innerHTML = `
                <div class="image-box">
                    <img src="${file.download_url}" alt="${file.name}">
                </div>
                <div class="logo-name" title="${file.name}">${file.name}</div>
                <div class="bottom">
                    <button onclick="copyUrl('${file.download_url}',this)">Copy URL</button>
                    <span class="size">${(file.size / 1024).toFixed(1)} KB</span>
                </div>
            `;
            container.appendChild(card);
        }
    });
}

function searchImages() {
    const input = document.getElementById("searchBox").value.toLowerCase();
    const cards = document.querySelectorAll(".card");
    cards.forEach(card => {
        const name = card.getAttribute("data-name");
        card.style.display = name.includes(input) ? "" : "none";
    });
}

function copyUrl(url, btn) {
    navigator.clipboard.writeText(url);
    btn.innerText = "✓ Copied";
    btn.style.background = "#16a34a";
    setTimeout(() => {
        btn.innerText = "Copy URL";
        btn.style.background = "#22c55e";
    }, 2000);
}

loadImages();
</script>

</body>
</html>
