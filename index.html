<style>
body{
    background:#000;
    font-family:Arial;
    padding:15px;
    margin:0;
}

h1{
    text-align:center;
    color:#d9ff00;
    margin-bottom:20px;
    font-size:30px;
}

#searchBox{
    width:100%;
    max-width: 800px;
    margin: 0 auto 20px auto;
    display: block;
    padding:12px 15px;
    font-size:16px;
    border:none;
    border-radius:20px;
    outline:none;
    box-sizing:border-box;
    background:#fff;
}

/* এক সারিতে ৬টি লোগো রাখার জন্য গ্রিড লেআউট */
.container{
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    max-width: 1200px;
    margin: 0 auto;
}

.card{
    background:#071a4a;
    border-radius:15px;
    overflow:hidden;
    border:2px solid #1e293b;
    padding:8px;
    text-align:center;
}

/* বক্সের আকার ছোট করা হয়েছে */
.image-box{
    background:white;
    padding:8px;
    height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
}

img{
    width:100%;
    height:80px;
    object-fit:contain;
}

.logo-name {
    color: #fff;
    margin-top: 8px;
    font-size: 11px;
    font-weight: bold;
    word-break: break-all;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.bottom{
    margin-top:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:5px;
}

button{
    padding:5px 8px;
    border:none;
    border-radius:15px;
    background:#22c55e;
    color:white;
    font-size:10px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#16a34a;
}

.size{
    font-size:10px;
    color:white;
    background:#111827;
    padding:3px 6px;
    border-radius:15px;
}

/* মোবাইল রেসপনসিভ: স্ক্রিন ছোট হলে কলাম সংখ্যা কমবে */
@media(max-width: 900px){
    .container { grid-template-columns: repeat(4, 1fr); }
}
@media(max-width: 600px){
    .container { grid-template-columns: repeat(2, 1fr); }
}
</style>
