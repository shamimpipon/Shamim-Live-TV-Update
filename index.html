<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ROAR TV</title>

<style>

body{
background:#000;
font-family:Arial;
padding:15px;
margin:0;
}

h1{
text-align:center;
color:#d9ff00;
margin-bottom:20px;
font-size:30px;
}

.container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
}

.card{
background:#071a4a;
border-radius:25px;
overflow:hidden;
border:2px solid #1e293b;
padding:15px;
text-align:center;
}

.image-box{
background:white;
padding:15px;
height:220px;
display:flex;
align-items:center;
justify-content:center;
border-radius:20px;
}

img{
width:100%;
height:190px;
object-fit:contain;
}

.bottom{
margin-top:15px;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

button{
padding:10px 15px;
border:none;
border-radius:20px;
background:#22c55e;
color:white;
font-size:13px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#16a34a;
}

.size{
font-size:13px;
color:white;
background:#111827;
padding:7px 12px;
border-radius:20px;
}

@media(max-width:700px){

.container{
grid-template-columns:repeat(2,1fr);
}

.image-box{
height:180px;
}

img{
height:150px;
}

}

</style>
</head>

<body>

<h1>ROAR CHANNELS</h1>

<div class="container" id="channels"></div>

<script>

const repo = "shamimpipon/ROAR";

async function loadImages(){

const api =
`https://api.github.com/repos/${repo}/contents`;

const response = await fetch(api);
const data = await response.json();

const container =
document.getElementById("channels");

data.forEach(file=>{

if(
file.name.endsWith(".png")
|| file.name.endsWith(".jpg")
|| file.name.endsWith(".jpeg")
|| file.name.endsWith(".webp")
){

const card = document.createElement("div");
card.className = "card";

card.innerHTML = `

<div class="image-box">

<img src="${file.download_url}">

</div>

<div class="bottom">

<button onclick="copyUrl('${file.download_url}', this)">
Copy URL
</button>

<span class="size">
${(file.size / 1024).toFixed(1)} KB
</span>

</div>

`;

container.appendChild(card);

}

});

}

function copyUrl(url, btn){

navigator.clipboard.writeText(url);

const oldText = btn.innerText;

btn.innerText = "✓ Copied";

btn.style.background = "#16a34a";

setTimeout(() => {

btn.innerText = "Copy URL";

btn.style.background = "#22c55e";

}, 2000);

}

loadImages();

</script>

</body>
</html>
